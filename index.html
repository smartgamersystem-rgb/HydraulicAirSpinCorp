<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading | HydraulicAirSpin</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap');

/* RESET GENERAL */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* BODY - CENTRADO TOTAL */
html, body {
    height: 100%;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(135deg, #FFD700, #FFC300);
    overflow: hidden;
}

/* CONTENEDOR CENTRAL */
.loader-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    width: 100%;
    padding: 0 15px;
}

/* LOGO + LINEA (alineado exacto con el texto) */
.loader-logo {
    font-size: 3rem;
    font-weight: 700;
    color: #111;
    letter-spacing: 3px;
    display: inline-block;
    position: relative;
}

/* span rojo */
.loader-logo span {
    color: #C20B0B;
}

/* Línea negra justo debajo del texto, misma longitud que logo */
.loader-logo::after {
    content: "";
    display: block;
    height: 4px;
    background: #111;
    margin-top: 10px;
    border-radius: 3px;
    width: 100%;
}

/* TEXTO DE CARGA */
.loading-text {
    font-size: 1.1rem;
    color: #333;
    letter-spacing: 2px;
    margin-top: 15px;
}

.dots::after {
    content: "";
    animation: dots 1.5s infinite;
}

@keyframes dots {
    0% { content:""; }
    33% { content:"."; }
    66% { content:".."; }
    100% { content:"..."; }
}

/* SPINNER */
.spinner {
    margin: 30px auto 0;
    width: 60px;
    height: 60px;
    border: 6px solid rgba(0,0,0,0.2);
    border-top: 6px solid #111;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* MEDIA QUERY MÓVIL */
@media (max-width: 480px) {
    .loader-logo {
        font-size: 2rem;
        letter-spacing: 1.5px;
    }
    .loader-logo::after {
        height: 3px;
    }
    .loading-text {
        font-size: 1rem;
        margin-top: 12px;
    }
    .spinner {
        width: 40px;
        height: 40px;
        border-width: 4px;
        margin-top: 20px;
    }
}

/* PROTECCIÓN ANTI COPIA */
* {
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}
input, textarea { user-select: text !important; }
img { pointer-events: none; max-width: 100%; height: auto; }

</style>

<script>
/* Redirige a index.html después de 4 segundos */
setTimeout(() => {
    window.location.href = "loading.html";
}, 4000);
</script>

<body>

<div class="loader-container">
    <div class="loader-logo">Hydraulic<span>AirSpin</span></div>
    <div class="loading-text">Loading <span class="dots"></span> wait</div>
    <div class="spinner"></div>
</div>

<script>
// Bloquear clic derecho
document.addEventListener('contextmenu', e => e.preventDefault());

// Bloquear teclas comunes
document.addEventListener('keydown', e => {
    if(e.ctrlKey && ['c','v','u','s','a'].includes(e.key.toLowerCase())) e.preventDefault();
    if(e.key === 'F12') e.preventDefault();
    if(e.ctrlKey && e.shiftKey && ['i','j'].includes(e.key.toLowerCase())) e.preventDefault();
});

// Detectar DevTools básico
setInterval(() => {
    const devtoolsOpen = window.outerWidth - window.innerWidth > 160 || window.outerHeight - window.innerHeight > 160;
    if(devtoolsOpen){
        document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#000;color:#fff;font-family:Arial;text-align:center;font-size:18px;">⚠ Acceso restringido<br>Esta acción ha sido bloqueada.</div>`;
    }
}, 1000);
</script>

</body>
</html>
