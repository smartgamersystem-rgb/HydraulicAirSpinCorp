<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading | HydraulicAirSpin</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap');

/* ================== */
/* RESET GENERAL 💜 */
/* ================== */
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* ================== */
/* BODY - CENTRADO COMPLETO 💜 */
/* ================== */
body {
    min-height: 100vh; /* mínimo alto, se adapta al móvil */
    display: flex;
    justify-content: center;
    align-items: center;
    font-family:'Montserrat', sans-serif;
    background: linear-gradient(135deg, #FFD700, #FFC300);
    padding:0;
    margin:0;
    overflow-y: auto; /* permite scroll solo si es necesario */
}

/* ================== */
/* CONTENEDOR CENTRAL 💜 */
/* ================== */
.loader-container {
    text-align: center;
    animation: fadeIn 1.5s ease forwards;
    padding: 20px 15px;
    max-width: 400px;
    width: 90%;
    background: rgba(255,255,255,0.05); /* ligera transparencia para dar relieve */
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

/* ================== */
/* LOGO 💜 */
/* ================== */
.loader-logo {
    font-size: 3rem;
    font-weight: 700;
    color: #111;
    letter-spacing: 3px;
    display: inline-block;
    position: relative; /* necesario para la línea */
    padding-bottom: 10px;
}

/* Línea negra debajo del logo 💜 */
.loader-logo::after {
    content: "";
    display: block;
    height: 4px;
    width: 60%; /* línea proporcional al logo */
    background: #111;
    margin: 10px auto 0;
    border-radius: 3px;
}

/* Color rojo en "AirSpin" */
.loader-logo span {
    color:#C20B0B;
}

/* ================== */
/* TEXTO DE CARGA 💜 */
/* ================== */
.loading-text {
    font-size: 1.1rem;
    color:#333;
    letter-spacing:2px;
    margin-top: 15px;
}

/* Puntos animados */
.dots::after {
    content:"";
    animation:dots 1.5s infinite;
}

@keyframes dots {
    0% { content:""; }
    33% { content:"."; }
    66% { content:".."; }
    100% { content:"..."; }
}

/* ================== */
/* SPINNER 💜 */
/* ================== */
.spinner {
    margin: 30px auto 0;
    width: 60px;
    height: 60px;
    border: 6px solid rgba(0,0,0,0.2);
    border-top: 6px solid #111;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* Fade entrada */
@keyframes fadeIn {
    from { opacity:0; transform:scale(0.95); }
    to { opacity:1; transform:scale(1); }
}

/* ================== */
/* MEDIA QUERY MÓVIL 💜 */
/* ================== */
@media (max-width: 480px) {
    .loader-container {
        padding: 15px 10px;
    }
    .loader-logo {
        font-size: 2rem;
        letter-spacing: 1.5px;
        padding-bottom: 8px;
    }
    .loader-logo::after {
        width: 70%; /* línea proporcional más ancha en móviles */
        height: 3px;
    }
    .loading-text {
        font-size: 1rem;
        margin-top: 12px;
    }
    .spinner {
        width: 40px;
        height: 40px;
        border-width: 4px;
        margin-top: 20px;
    }
}
</style>

<script>
/* Redirige a index.html después de 4 segundos */
setTimeout(() => {
    window.location.href = "loading.html";
}, 4000);
</script>

<body>

<div class="loader-container">
    <div class="loader-logo">
        Hydraulic<span>AirSpin</span>
    </div>

    <div class="loading-text">
        Loading <span class="dots"></span> wait
    </div>

    <div class="spinner"></div>
</div>

<!-- ================== -->
<!-- PROTECCIÓN ANTI COPIA 💜 -->
<!-- ================== -->
<style>
* {
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}
input, textarea {
    user-select: text !important;
}
img {
    pointer-events: none;
    max-width: 100%;
    height: auto;
}
</style>

<script>
// Bloquear clic derecho
document.addEventListener('contextmenu', e => e.preventDefault());

// Bloquear teclas comunes
document.addEventListener('keydown', e => {
    if(e.ctrlKey && ['c','v','u','s','a'].includes(e.key.toLowerCase())) e.preventDefault();
    if(e.key === 'F12') e.preventDefault();
    if(e.ctrlKey && e.shiftKey && ['i','j'].includes(e.key.toLowerCase())) e.preventDefault();
});

// Detectar DevTools básico
setInterval(() => {
    const devtoolsOpen = window.outerWidth - window.innerWidth > 160 || window.outerHeight - window.innerHeight > 160;
    if(devtoolsOpen){
        document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#000;color:#fff;font-family:Arial;text-align:center;font-size:18px;">⚠ Acceso restringido<br>Esta acción ha sido bloqueada.</div>`;
    }
}, 1000);
</script>

</body>
</html>
